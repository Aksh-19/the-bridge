repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types_or: [python, pyi, jupyter]
      - id: nbstripout
        name: strip notebook outputs
        entry: .venv/bin/nbstripout
        language: system
        files: \.ipynb$
